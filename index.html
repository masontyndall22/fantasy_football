<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>The League</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The League">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="sidebar-nav" id="sidebarNav">
  <div class="sidebar-nav__brand">
    <img class="sidebar-nav__mark" src="assets/mark.png" alt="">
    <span class="sidebar-nav__title">The League</span>
  </div>
  <button class="nav-btn is-active" data-screen="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"></path><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"></path></svg>
    Home
  </button>
  <button class="nav-btn" data-screen="bios">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"></path></svg>
    Bios
  </button>
  <button class="nav-btn" data-screen="scoring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13"></path><path d="M11 20V6"></path><path d="M18 20v-9"></path></svg>
    Scoring
  </button>
  <button class="nav-btn" data-screen="rivals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h5l-1 8 8-10h-5l1-8Z"></path></svg>
    Rivals
  </button>
  <button class="nav-btn" data-screen="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
    History
  </button>
</nav>

<header class="app-header">
  <div class="app-header__row">
    <div class="app-header__brand">
      <img class="app-header__mark" src="assets/mark.png" alt="">
      <h1 class="app-header__title">The League</h1>
    </div>
    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 0 1 13.8-5.6L20 9"></path><path d="M20 4.5V9h-4.5"></path>
        <path d="M20 12a8 8 0 0 1-13.8 5.6L4 15"></path><path d="M4 19.5V15h4.5"></path>
      </svg>
    </button>
  </div>
  <div class="last-updated" id="lastUpdated">Loading…</div>
  <div class="app-header__countdown" id="seasonCountdown"></div>
</header>

<main>

  <!-- ============ HOME ============ -->
  <section class="screen is-active" id="screen-home">
    <div id="preseasonSlot"></div>

    <div class="section-label">In First Place</div>
    <div class="leader-card" id="leaderCard"></div>
    <div class="mini-standings-row" id="homeStandingsList"></div>
    <div id="onNoticeSlot"></div>

    <div class="section-label" id="weeklyUpdateLabel">Weekly Update</div>
    <div class="weekly-update-list" id="weeklyUpdateList"></div>
  </section>

  <!-- ============ BIOS ============ -->
  <section class="screen" id="screen-bios">
    <div class="section-label">The Roster</div>
    <div id="bioList"></div>
  </section>

  <!-- ============ SCORING ============ -->
  <section class="screen" id="screen-scoring">
    <div id="weeksLeftSlot"></div>

    <div class="section-label" id="scoringLeaderboardLabel">Full Leaderboard</div>
    <div id="scoringLeaderboard"></div>

    <div class="section-label" id="scoringCategoryLabel" style="margin-top:0">By Category</div>
    <div class="pillar-tabs" id="pillarTabs"></div>
    <div id="categorySlot"></div>
  </section>

  <!-- ============ RIVALS ============ -->
  <section class="screen" id="screen-rivals">
    <div class="section-label">Rivals</div>
    <div id="rivalsList"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="screen" id="screen-history">
    <div id="recordsSlot"></div>
    <div id="fantasyHistorySlot"></div>
    <div id="leagueHistorySlot"></div>
  </section>

</main>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn is-active" data-screen="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"></path><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"></path></svg>
    Home
  </button>
  <button class="nav-btn" data-screen="bios">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"></path></svg>
    Bios
  </button>
  <button class="nav-btn" data-screen="scoring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13"></path><path d="M11 20V6"></path><path d="M18 20v-9"></path></svg>
    Scoring
  </button>
  <button class="nav-btn" data-screen="rivals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h5l-1 8 8-10h-5l1-8Z"></path></svg>
    Rivals
  </button>
  <button class="nav-btn" data-screen="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
    History
  </button>
</nav>

<div class="year-review-overlay" id="yearReviewOverlay"></div>

<script type="module" src="app.js"></script>
</body>
</html>
